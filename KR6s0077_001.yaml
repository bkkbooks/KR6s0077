body:
  text: 上藥三品神與氣精恍恍惚惚杳杳存無守有頃刻而成回風混合百日功靈默朝上帝一紀飛升知者易悟昧者難行履踐天光呼吸育清出玄入牝若亡若存綿綿不絶固蒂深根人各有精精合其神神合其氣氣合體真不得其真皆是強名神能入石神能飛形入水不溺入火不焚神依形生精依氣盈不凋不殘松柏青青三品一理妙不可聽其聚則有其散則零七竅相通竅竅光明聖日聖月照耀金一得永得自然身輕太和充溢骨散寒瓊得丹則靈不得則傾丹在身中非白非青誦之萬遍妙理自明傳經始流昔有高道到處源於石城縣仙界鋪遇真仙傳授此經獲免厄難遂刊行焉嘗伏而誦之辭約義博蓋撮本行集經之樞要是以謂之經髓也涿鹿山雲居寺有洞室貯釋梵之經殆至萬卷故名是山為小西天焉夫三界萬靈尊莫尊於昊天金闕玉皇上帝玄功妙德載在本行集經正當刻之金石藏之名山傳之萬世也是以至心各捐資力請匠鐫刻經髓暨經纂及心印經共為一卷凡一千柒佰肆拾捌字置諸石室用彰悠久所以然者蓋欲仰答天地君親四恩於萬一云爾時大明宣德三年嵗次戊申四月吉日奉道信官向福善阮常就勝等稽首頓首百拜謹記同盟助資奉國將軍都指揮同知武興奉直大夫工部虞衡員外郎陳孚迪功郎工部營繕所所副陳道昌懷遠將軍指揮同知段義李實郭敏管義明威將軍指揮僉事冀源黃安武略將軍副千戶羅成萬理王友張禮嗣全真教高士陳風便正一盟威寶籙弟子王至玄字利賔書信士曾至中馮本源章文得崔景平李景雲厲正善夏惠機葛鏞莊文玉戴道清朱福惠鐫匠程善刊
